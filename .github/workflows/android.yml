name: Build VoxelLive Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout VoxelLive
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          echo "Accepting Android SDK licenses..."
          yes | sdkmanager --licenses || true

          echo "Installing Android SDK..."
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Check project files
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml

      - name: Build VoxelLive APK
        run: |
          gradle --no-daemon clean assembleDebug

      - name: Verify APK
        run: |
          find app/build/outputs/apk -type f -name "*.apk"

      - name: Upload VoxelLive APK
        uses: actions/upload-artifact@v4
        with:
          name: VoxelLive-Android-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
